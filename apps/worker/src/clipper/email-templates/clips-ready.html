<!-- Clipper → Your clips are ready (sent when a project finishes processing).
     Subject: Your clips are ready: {{ title }}
     Preview: {{ count }} clips found — the best one: {{ top }}
     Placeholders: {{ link }} (the project) {{ title }} {{ count }} {{ top }} {{{ clips }}} (rows, built by the Worker) -->
        <tr>
          <td style="padding:22px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:800;color:#12121a;">Your clips are ready</h1>
            <p style="margin:0;font-size:15px;line-height:1.65;color:#2a2a38;">Clipper found <strong>{{ count }} clips</strong> in <strong>{{ title }}</strong>. Here are the strongest:</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
{{{ clips }}}
          </td>
        </tr>
        <tr>
          <td style="padding:22px 32px 0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="border-radius:12px;background:#6366f1;">
                <a href="{{ link }}" style="display:inline-block;background:#6366f1;padding:13px 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;">See all clips</a>
              </td>
            </tr></table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 28px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#5d5f75;">
            <div style="border-top:1px solid #e4e4f0;padding-top:16px;">Uploads and clips are kept for 7 days — export the ones you want before then.</div>
          </td>
        </tr>
