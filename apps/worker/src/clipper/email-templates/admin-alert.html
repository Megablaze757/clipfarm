<!-- Clipper → Admin alert: jobs failed (sent to admins, at most every 10 minutes).
     Subject: Clipper: {{ count }} job(s) failed
     Preview: {{ first }}
     Placeholders: {{ link }} (Admin → Jobs) {{ count }} {{ first }} {{{ rows }}} -->
        <tr>
          <td style="padding:22px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:800;color:#b42318;">{{ count }} job(s) failed</h1>
            <p style="margin:0;font-size:15px;line-height:1.65;color:#2a2a38;">These failed in the last few minutes. You can retry them from Admin → Jobs.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#2a2a38;">
{{{ rows }}}
          </td>
        </tr>
        <tr>
          <td style="padding:22px 32px 28px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="border-radius:12px;background:#12121a;">
                <a href="{{ link }}" style="display:inline-block;background:#12121a;padding:12px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;">Open Admin → Jobs</a>
              </td>
            </tr></table>
          </td>
        </tr>
