<!-- Clipper → Admin daily summary (sent to admins once a day, ~08:00 UTC).

     Preview: {{ new_users }} new users · {{ minutes }} minutes processed · {{ failed }} failed
     Placeholders: {{ link }} (Admin) and the numbers below; {{{ rows }}} -->
        <tr>
          <td style="padding:22px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:800;color:#12121a;">Your daily Clipper summary</h1>
            <p style="margin:0;font-size:15px;line-height:1.65;color:#2a2a38;">Where things stand this morning (month to date).</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.7;color:#2a2a38;">
{{{ rows }}}
          </td>
        </tr>
        <tr>
