name: Clipper Whisper check

# Fast check of the built-in Whisper fallback on a GitHub runner: installs
# faster-whisper, transcribes 2 minutes of synthetic speech with the "base"
# and "small" models, and reports speed — or the exact error — as public
# annotations (job logs need a GitHub login; annotations don't).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/clipper-whisper-check.yml", "apps/container/scripts/whisper_local.py"]

permissions:
  contents: read

jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Speech sample
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          python3 .github/bench/make_speech_text.py > /tmp/speech.txt
          espeak-ng -s 165 -f /tmp/speech.txt -w /tmp/speech.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/speech.wav -t 120 -ac 1 -ar 16000 -c:a flac /tmp/chunk.flac
      - name: Install and run
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          set +e
          note() { echo "::notice title=Whisper check::$*"; }
          s=$(date +%s.%N)
          if ! "$PY" -m pip install --quiet "faster-whisper>=1.1,<2" > pip.log 2>&1; then
            note "pip install FAILED: $(tail -5 pip.log | tr '\n' ' ' | cut -c1-900)"; exit 1
          fi
          note "install $(echo "$(date +%s.%N) - $s" | bc | cut -c1-5)s — $("$PY" -c 'import faster_whisper, ctranslate2; print("faster-whisper", faster_whisper.__version__, "ctranslate2", ctranslate2.__version__)' 2>&1 | tail -1)"
          for m in base small; do
            WHISPER_MODEL=$m "$PY" apps/container/scripts/whisper_local.py /tmp/chunk.flac en > /dev/null 2> warm.log \
              || { note "$m FAILED: $(grep -v '^\s*$' warm.log | tail -6 | tr '\n' ' ' | cut -c1-900)"; continue; }
            s=$(date +%s.%N)
            WHISPER_MODEL=$m "$PY" apps/container/scripts/whisper_local.py /tmp/chunk.flac en > out.json 2> run.log
            secs=$(echo "$(date +%s.%N) - $s" | bc)
            words=$(python3 -c "import json;print(len(json.load(open('out.json'))['words']))" 2>&1)
            note "$m: 120 s of speech in ${secs:0:5} s ($(echo "120 / $secs" | bc -l | cut -c1-4)x real time), $words words → 1 hour ≈ $(echo "$secs * 30 / 60" | bc -l | cut -c1-4) min"
          done
