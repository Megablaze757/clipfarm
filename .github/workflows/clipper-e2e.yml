name: Clipper 1-hour test

# End-to-end timing through the LIVE app with no account (guest mode):
# generates a 1-hour 1080p H.264 video with synthetic speech, uploads it like
# the website does, creates a project and times every stage until the clips
# are ready. Results appear as annotations on the run.
#
# Note: this creates a real project in the shared Guest workspace and uses
# ~60 source minutes of its monthly allowance plus some Groq quota.
# Run: Actions → Clipper 1-hour test → Run workflow (or push this file).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Length of the test video in minutes"
        default: "60"
  push:
    branches: [main]
    paths: [".github/workflows/clipper-e2e.yml", ".github/bench/e2e.py"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MINUTES: ${{ inputs.minutes || '60' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          mkdir -p ~/t && cd ~/t
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$HOME/t" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng > /dev/null
      # The generated video is cached, so re-runs skip the ~10-minute encode.
      - name: Cache the test video
        id: vid
        uses: actions/cache@v4
        with:
          path: /tmp/e/test.mp4
          key: e2e-video-v1-${{ env.MINUTES }}min
      - name: Make the test video
        if: steps.vid.outputs.cache-hit != 'true'
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "::error::minutes must be a number"; exit 1 ;; esac
          mkdir -p /tmp/e && cd /tmp/e
          python3 "$GITHUB_WORKSPACE/.github/bench/make_speech_text.py" > speech.txt
          espeak-ng -s 165 -f speech.txt -w speech.wav
          # Talking-head-like: a mostly static frame with a moving element, like a podcast camera.
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=s=1920x1080:r=30" -stream_loop -1 -i speech.wav \
            -t $((MINUTES*60)) -c:v libx264 -preset ultrafast -crf 26 -g 60 -pix_fmt yuv420p -c:a aac -b:a 128k -ac 2 \
            -movflags +faststart test.mp4
          ls -la test.mp4
      - name: Upload and time it through the live app
        run: python3 "$GITHUB_WORKSPACE/.github/bench/e2e.py" /tmp/e/test.mp4 "E2E test (${MINUTES} min)"
