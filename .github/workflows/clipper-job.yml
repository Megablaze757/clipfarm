name: Clipper video job

# The free FFmpeg runner. The apex-api Worker starts this with a
# repository_dispatch event ("clipper-process" / "clipper-render") carrying only
# a project or render id. The run then fetches the job from the Worker and does
# all its reads and writes through it, proving who it is with a GitHub OIDC
# token (id-token: write below). So:
#   - this repo needs NO secrets;
#   - nothing sensitive appears in the (public) run log;
#   - the Worker only trusts this exact file on main.
#
# Free on public repos; 2,000 minutes/month on private ones. A 1-hour podcast
# takes roughly 10–20 runner minutes.

on:
  repository_dispatch:
    types: [clipper-process, clipper-render]
  workflow_dispatch:
    inputs:
      kind:
        description: "process or render"
        type: choice
        options: [process, render]
        default: process
      id:
        description: "Project id (process) or render job id (render)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  # One run per job id: a duplicate dispatch waits, then finds the job taken and exits.
  group: clipper-${{ github.event.client_payload.id || inputs.id }}
  cancel-in-progress: false

jobs:
  run:
    # GitHub's runner by default; the operator's own PC (a self-hosted runner)
    # when the Worker says so — Admin → Settings → "Run jobs on my computer".
    runs-on: ${{ github.event.client_payload.runs_on || vars.CLIPPER_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      CLIPPER_API_URL: ${{ vars.CLIPPER_API_URL || 'https://apex-api.fitnessguru.workers.dev' }}
      JOB_KIND: ${{ github.event.action == 'clipper-render' && 'render' || github.event.action == 'clipper-process' && 'process' || inputs.kind }}
      JOB_ID: ${{ github.event.client_payload.id || inputs.id }}
    steps:
      # The id arrives from outside, so it's validated before anything uses it,
      # and only ever passed through env vars — never pasted into a script.
      - name: Check job
        run: |
          case "$JOB_KIND" in process|render) ;; *) echo "::error::bad kind"; exit 1 ;; esac
          echo "$JOB_ID" | grep -Eq '^[0-9a-fA-F-]{36}$' || { echo "::error::bad id"; exit 1; }
          echo "Running $JOB_KIND $JOB_ID"

      - uses: actions/checkout@v4

      # Prebuilt static FFmpeg (libx264, libass, freetype), cached between runs —
      # apt-get update + install cost 30-60 s on every job. Re-downloaded weekly.
      - name: Week number (tool cache key)
        id: week
        run: echo "n=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/clipper-tools
          key: clipper-tools-v2-${{ steps.week.outputs.n }}
      - name: Download FFmpeg + yt-dlp + TwitchDownloaderCLI
        if: steps.tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/clipper-tools && cd ~/clipper-tools
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          curl -sSfL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp
          # Twitch VOD chat replays, for chat analysis on long streams.
          gh release download -R lay295/TwitchDownloader -p '*CLI*Linux-x64.zip' -O tdcli.zip && unzip -oq tdcli.zip TwitchDownloaderCLI && rm tdcli.zip || echo "::warning::TwitchDownloaderCLI unavailable — chat analysis needs a chat log upload"
          chmod +x ffmpeg ffprobe yt-dlp; [ -f TwitchDownloaderCLI ] && chmod +x TwitchDownloaderCLI || true
      - name: Put tools on PATH
        run: |
          echo "$HOME/clipper-tools" >> "$GITHUB_PATH"
          "$HOME/clipper-tools/ffmpeg" -hide_banner -version | head -1
          # Caption font: usually preinstalled; install only if missing.
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq fonts-dejavu-core > /dev/null; } || echo "::notice::DejaVu font not installed (Clipper ships its own caption fonts)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Python for the built-in Whisper fallback. faster-whisper itself installs
      # only if Groq rate-limits this job, so normal jobs don't pay for it.
      # Exports (render jobs) never transcribe, so they skip all of this.
      - uses: actions/setup-python@v5
        if: env.JOB_KIND == 'process'
        id: py
        with:
          python-version: "3.12"
      - name: Cache Whisper model
        if: env.JOB_KIND == 'process'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      # Automatic reframing: OpenCV + the YuNet face model (~230 KB), cached.
      - name: Cache face model + pip
        if: env.JOB_KIND == 'process'
        uses: actions/cache@v4
        with:
          path: |
            ~/clipper-vision
            ~/.cache/pip
          key: vision-v1-${{ hashFiles('apps/container/scripts/requirements-vision.txt') }}
      - name: Install face detection
        if: env.JOB_KIND == 'process'
        run: |
          "${{ steps.py.outputs.python-path }}" -m pip install --quiet -r apps/container/scripts/requirements-vision.txt || echo "::warning::OpenCV install failed — clips will use a centre crop"
          mkdir -p ~/clipper-vision
          M=~/clipper-vision/face_detection_yunet_2023mar.onnx
          [ -s "$M" ] || curl -sSfL https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx -o "$M" || echo "::warning::face model download failed"
          [ "$(stat -c%s "$M" 2>/dev/null || echo 0)" -gt 100000 ] && echo "FACE_MODEL=$M" >> "$GITHUB_ENV" || echo "::warning::face model missing — clips will use a centre crop"

      # Installed packages are cached by lockfile, so most jobs skip `npm ci`.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/container/node_modules
          key: nm-container-${{ hashFiles('package-lock.json') }}
      - name: Build the pipeline
        run: |
          [ "${{ steps.nm.outputs.cache-hit }}" = "true" ] || npm ci --workspace=apps/container --no-audit --no-fund
          npm run build --workspace=apps/container

      # Long sources need room: source + working copy + audio can pass 10 GB.
      # Use whichever of /mnt (the runner's extra disk) or the temp dir has more.
      - name: Pick the roomiest disk
        if: env.JOB_KIND == 'process'
        run: |
          best="$RUNNER_TEMP"; bestfree=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          # sudo -n: never prompt for a password (a home PC may not allow sudo).
          if [ -d /mnt ] && sudo -n mkdir -p /mnt/clipper 2>/dev/null && sudo -n chown "$USER" /mnt/clipper 2>/dev/null; then
            mntfree=$(df -Pk /mnt | awk 'NR==2{print $4}')
            [ "$mntfree" -gt "$bestfree" ] && best=/mnt && bestfree=$mntfree
          fi
          echo "WORK_DIR=$best/clipper" >> "$GITHUB_ENV"
          echo "Working in $best/clipper ($((bestfree / 1024 / 1024)) GB free)"

      - name: Run
        env:
          WHISPER_PYTHON: ${{ steps.py.outputs.python-path }}
          # "small": noticeably more accurate than "base" (measured 7.7x real time on
          # a runner, ~8 min per hour of audio, vs 19x / ~3 min for base).
          WHISPER_MODEL: small
        run: |
          [ -x "$HOME/clipper-tools/TwitchDownloaderCLI" ] && export TWITCH_CHAT_BIN="$HOME/clipper-tools/TwitchDownloaderCLI"
          node apps/container/dist/cli.js "$JOB_KIND" "$JOB_ID"
